# The operator's MAS admin client: one generated secret, as the operator's
# environment and as a MAS config file
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: matrix-operator-mas
  namespace: matrix
spec:
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-operator-mas
  namespace: matrix
spec:
  refreshInterval: "0"
  target:
    template:
      data:
        # MAS wants a ULID: no I, L, O or U
        client-id: 00000000PENDEFENCE0PERAT0R
        client-secret: "{{ .password }}"
        mas-config.yaml: |
          clients:
            - client_id: 00000000PENDEFENCE0PERAT0R
              client_auth_method: client_secret_basic
              client_secret: "{{ .password }}"
          policy:
            data:
              admin_clients:
                - 00000000PENDEFENCE0PERAT0R
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: matrix-operator-mas
