apiVersion: platform.opendefence.fi/v1alpha1
kind: Integration
metadata:
  name: matrix
spec:
  displayName: Matrix
  version: "0.1.0+261111"
  productInfo:
    descriptions:
      - language: en
        title: Matrix
        description: Matrix messaging service
      - language: fi
        title: Matrix
        description: Matrix viestipalvelu
      - language: sv
        title: Matrix
        description: Matrix meddelandetjänst
  extraRoles:
    - name: matrix-user
      displayName: Matrix user
    - name: matrix-admin
      displayName: Matrix admin
  network:
    ingress:
      httpRoutes:
        - host: Public
          path: /_matrix
          service: matrix-synapse
          port: 8008
        - host: Public
          path: /_synapse/client
          service: matrix-synapse
          port: 8008
        - host: Public
          path: /.well-known/matrix
          service: matrix-well-known
          port: 8010
        - host: Public
          path: /integrations/matrix/auth
          stripPrefix: /integrations/matrix/auth
          blockedPaths:
            - /integrations/matrix/auth/api/admin
          service: matrix-matrix-authentication-service
          port: 8080
        - host: Public
          path: ^/_matrix/client/(.*)/(login|logout|refresh)
          service: matrix-matrix-authentication-service
          port: 8080
