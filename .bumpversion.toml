[tool.bumpversion]
current_version = "0.1.0+261111"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)\+(?P<build>\d+)'
serialize = ["{major}.{minor}.{patch}+{build}"]
commit = false
tag = false

[tool.bumpversion.parts.build]
calver_format = "{0Y}{0M}{0D}"

[[tool.bumpversion.files]]
filename = "manifests/integration.yaml"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "zarf.yaml"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

# Container tags can't contain "+", so the image uses "-" before the build number
[[tool.bumpversion.files]]
filename = "manifests/operator/deployment.yaml"
search = "ghcr.io/opendefence/integration-matrix-operator:{current_major}.{current_minor}.{current_patch}-{current_build}"
replace = "ghcr.io/opendefence/integration-matrix-operator:{new_major}.{new_minor}.{new_patch}-{new_build}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "opendefence-integration-matrix"
version = "{current_version}"'''
replace = '''
name = "opendefence-integration-matrix"
version = "{new_version}"'''
