# The kind cluster, the registries and the base package come from opendefence/base.
# The core package comes from opendefence/core.
version: "3"

vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "opendefence-dev"}}'
  KUBE_CONTEXT: '{{.KUBE_CONTEXT | default (printf "kind-%s" .CLUSTER_NAME)}}'

includes:
  registries:
    taskfile: https://raw.githubusercontent.com/opendefence/base/b04ff076bc4d3ec6a2ce01074a66f10d0f09b7a6/taskfiles/registries.yaml
    checksum: 7cfd8bb65f12fa010af65ae676581526b34d7a9dbbdad6901b35164e64c79d71 # pragma: allowlist secret - public SHA-256
  cluster:
    taskfile: https://raw.githubusercontent.com/opendefence/base/b04ff076bc4d3ec6a2ce01074a66f10d0f09b7a6/taskfiles/cluster.yaml
    checksum: f7de63fa2552656598c042959da7d5af8faa273d19705a269e83694c70a867e1 # pragma: allowlist secret - public SHA-256
  base:
    taskfile: https://raw.githubusercontent.com/opendefence/base/b04ff076bc4d3ec6a2ce01074a66f10d0f09b7a6/taskfiles/base.yaml
    checksum: fd3866d05fa6bb89eb9ffbed4c71fbca47f049750a993da5d012f19e0180c567 # pragma: allowlist secret - public SHA-256
  core:
    taskfile: https://raw.githubusercontent.com/opendefence/core/20ded0bea057acb40428febb87c563cd966c1117/taskfiles/core.yaml
    checksum: 32b2f7f6f105a498f8e21f34f2a61db6b6b5e1ddb0c9545774eb61d46ead0e3a # pragma: allowlist secret - public SHA-256
  build:
    taskfile: ./taskfiles/build.yaml
    dir: "{{.ROOT_DIR}}"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  lint:
    desc: Run all pre-commit hooks
    cmds:
      - uv run --locked prek run --all-files

  test:
    desc: Run the test suite; pass pytest arguments after --
    cmds:
      - uv run --locked pytest {{.CLI_ARGS}}

  up:
    desc: Start the cluster, deploy the base and core packages, then deploy this checkout
    cmds:
      - task: registries:up
      - task: cluster:create
      - task: registries:connect
      - task: cluster:configure-mirrors
      - task: cluster:document-local-registry
      - task: base:install
        vars:
          BASE_ISSUER: '{{.BASE_ISSUER | default "ca"}}'
      - task: core:install
        vars:
          CORE_SET_VALUES: '{{.CORE_SET_VALUES | default "domain=local-dev.opendefence.fi,hsts.maxAge=0,ports.serviceType=NodePort"}}'
      - task: build:deploy

  dev:
    desc: Deploy this checkout with Tilt and redeploy on change
    preconditions: &tilt
      - sh: command -v tilt >/dev/null
        msg: tilt is not on PATH
      - sh: test "$(kubectl config current-context)" = {{.KUBE_CONTEXT | shellQuote}}
        msg: Switch kubectl to the selected KUBE_CONTEXT before using Tilt
    env: &tilt-env
      KUBE_CONTEXT: "{{.KUBE_CONTEXT}}"
    vars:
      # The first free port from Tilt's default
      TILT_PORT:
        sh: python3 -c 'import itertools, socket; print(next(p for p in itertools.count(10350) if socket.socket().connect_ex(("127.0.0.1", p))))'
    cmds:
      - tilt up --port {{.TILT_PORT}}

  dev:down:
    desc: Remove the operator Tilt deployed
    preconditions: *tilt
    env: *tilt-env
    cmds:
      - tilt down

  down:
    desc: Delete the kind cluster and leave the registries running
    cmds:
      - task: registries:disconnect
      - task: cluster:down

  reset:
    desc: Delete the kind cluster, owned registry containers, and anonymous volumes
    cmds:
      - task: down
      - task: registries:down
